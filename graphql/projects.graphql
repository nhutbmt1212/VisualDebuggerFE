query GetProjects($page: Int, $limit: Int) {
  projects(page: $page, limit: $limit) {
    items {
      id
      name
      description
      apiKey
      storageUsage
      storageLimit
      createdAt
      updatedAt
      activityTrend
      user {
        id
        email
        name
        plan
        createdAt
        updatedAt
      }
    }
    totalCount
    page
    limit
    totalPages
    hasNextPage
    hasPreviousPage
  }
}

mutation CreateProject($input: CreateProjectInput!) {
  createProject(input: $input) {
    id
    name
    description
    apiKey
    createdAt
  }
}

mutation RegenerateProjectKey($id: ID!) {
  regenerateProjectKey(id: $id) {
    id
    apiKey
  }
}

query GetProject($id: ID!) {
  project(id: $id) {
    id
    name
    description
    apiKey
    storageUsage
    storageLimit
    createdAt
    updatedAt
    activityTrend
    user {
      id
      email
      name
      plan
      createdAt
      updatedAt
    }
  }
}

query GetDashboardStats($range: String) {
  dashboardStats(range: $range) {
    totalEvents
    errorRate
    avgLatency
    activeSessions
    eventFrequency
    trend {
      hour
      requests
    }
    totalEventsChange
    errorRateChange
    avgLatencyChange
    activeSessionsChange
  }
}

query GetProjectStats($projectId: ID!, $range: String) {
  projectStats(projectId: $projectId, range: $range) {
    totalEvents
    errorRate
    avgLatency
    activeSessions
    eventFrequency
    trend {
      hour
      requests
    }
    totalEventsChange
    errorRateChange
    avgLatencyChange
    activeSessionsChange
  }
}

