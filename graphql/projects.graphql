query GetSession($id: ID!) {
  session(id: $id) {
    id
    environment
    userAgent
    ipAddress
    metadata
    startedAt
    endedAt
    project {
      id
      name
    }
    events {
      id
      type
      name
      filePath
      lineNumber
      columnNumber
      arguments
      returnValue
      errorMessage
      errorStack
      httpMethod
      httpUrl
      httpStatus
      duration
      depth
      timestamp
      parentEventId
    }
  }
}

